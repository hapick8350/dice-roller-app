<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOM 포털 로그인</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <form id="login-form" class="login-box card" autocomplete="on">
    <h1>BOM 포털</h1>
    <p class="login-sub" id="login-sub">SAP Business ByDesign</p>
    <label>사용자 ID
      <input name="user" id="user" autocomplete="username" required autofocus>
    </label>
    <label>비밀번호
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="primary" id="login-btn">로그인</button>
    <div id="login-msg" class="msg err" hidden></div>
    <p class="login-note" id="login-note"></p>
  </form>
  <script src="login.js"></script>
</body>
</html>
